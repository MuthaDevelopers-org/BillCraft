# Unit tests and a syntax check on every push and pull request.
# The browser tests (npm run e2e) need Chrome and run locally; see docs/DEPLOY.md.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
